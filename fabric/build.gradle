plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

configurations {
    // YACL 可选界面库：只按 run 注入到带界面的运行环境（noYaclClient 不注入 = 真无 YACL 冒烟）
    yaclDevRuntime
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    // YACL 配置界面（可选依赖）：编译期 compileOnly，运行期按 run 注入 yaclDevRuntime
    compileOnly("dev.isxander:yet-another-config-lib:${yacl_version}-fabric")
    yaclDevRuntime("dev.isxander:yet-another-config-lib:${yacl_version}-fabric")
    // ModMenu 模组列表入口（可选依赖：fabric.mod.json 只标 suggests）
    implementation("com.terraformersmc:modmenu:${modmenu_version}")
}

// 自动化测试 mod 源集（fabric-loom 不自动注册，手动建）：
// 独立命名空间 com.mockplayer.test，产物绝不进生产 jar（生产 jar 只含 main 源集）
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    noyacl {
        compileClasspath += sourceSets.testmod.compileClasspath + sourceSets.testmod.output
        runtimeClasspath += sourceSets.testmod.runtimeClasspath.filter { f ->
            !f.name.contains("yet-another-config-lib")
        }
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        testClient {
            client()
            setConfigName('Fabric Test')
            ideConfigGenerated(false)
            runDir('runs/client')
            source(sourceSets.testmod)
            // IDE 右上角用 .idea/runConfigurations/Fabric_Test.xml（Gradle 任务 :fabric:runTestClient -Psuite=all）
            // 命令行 -Psuite=api-smoke 单套件；缺省 all = 全部套件
            property('mockplayer.test', project.findProperty('suite') ?: 'all')
            // 渲染路径验证探针（生产默认关闭，仅测试开启，记录 Mixin 注入证据）
            property('mockplayer.debugRenderProbe', 'true')
        }
        noYaclClient {
            client()
            setConfigName('Fabric NoYacl Test')
            ideConfigGenerated(false)
            runDir('runs/client')
            // classpath 用不含 YACL 的 noyacl sourceSet（无 YACL 冒烟保持真实）
            source(sourceSets.noyacl)
            // 无 YACL 冒烟：本 run 不注入 yaclDevRuntime，验证可选依赖守卫
            property('mockplayer.noyacl', '1')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// YACL 进 main runtimeClasspath：Gradle run 与 loom 生成的 IDE run config 都自动带，
// 配置界面在 IDE 启动时可用
configurations.named('runtimeClasspath') {
    extendsFrom(configurations.yaclDevRuntime)
}
// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
