# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.2.1
group=com.mockplayer
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Mockplayer
mod_author=1cyberlangke1
mod_id=mockplayer
license=MIT
credits=
description=Mockplayer - a Minecraft mod for 26.1.2, built for both Fabric and NeoForge.
minecraft_version_range=[26.1.2, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.145.4+26.1.2
fabric_loader_version=0.18.6

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.7-beta
neoforge_loader_version_range=[4,)

# YACL（可选配置界面库）+ ModMenu（Fabric 可选模组列表入口）
# 完整版本 = <yacl_version>-fabric / -neoforge（如 3.9.6+26.2-fabric）
yacl_version=3.9.6+26.1
modmenu_version=18.0.0

# JOL（仅测试端校准用，不进生产 jar）：创建假人前的客户端共享图快照
jol_version=0.17

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Force Gradle daemon to run on our local Java 25 (avoid auto-downloading another JDK)
org.gradle.java.home=C:/Minecraft_JDK/1.16++/java25_graalvm
# Tell the Gradle toolchain where to find installed JDKs (so it never downloads a second JDK)
org.gradle.java.installations.paths=C:/Minecraft_JDK/1.16++/java25_graalvm,C:/Minecraft_JDK/1.16++/java21_zulu
