plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// YACL 可选界面库：编译期 compileOnly，运行期进 runtimeClasspath（IDE/Gradle run 可用），
// noYaclClient 用独立 sourceSet 排除（无 YACL 冒烟保持真实）
configurations {
    yaclDevRuntime
}

// 自动化测试 mod 源集（独立命名空间 com.mockplayer.test，产物绝不进生产 jar）
// 必须先于 neoForge block 定义（mods 注册引用它）
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        compileClasspath += project(':common').sourceSets.testShared.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        runtimeClasspath += project(':common').sourceSets.testShared.output
    }
    noyacl {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.testmod.output
        runtimeClasspath += sourceSets.main.runtimeClasspath.filter { f ->
            !f.name.contains("yet-another-config-lib")
        }
        runtimeClasspath += sourceSets.testmod.output
    }
}

// 新框架共享测试源码：testmod 编译/运行前先构建 common 的 testShared 输出
// moddev 只把 testmod 自己的 classes 目录作为 mod 文件加载，common 测试类必须复制进来
tasks.register('copyTestSharedClasses', Copy) {
    from project(':common').sourceSets.testShared.output
    into layout.buildDirectory.dir('classes/java/testmod')
}
tasks.named('testmodClasses').configure {
    dependsOn tasks.named('copyTestSharedClasses')
    dependsOn project(':common').tasks.named('testSharedClasses')
}

// neoforge loader 扫描 testmod 的 classes 目录作为独立 mod 文件，必须物理含 META-INF/neoforge.mods.toml
// （main 源集由 moddev 特殊处理可容忍缺失，自定义 testmod 源集不行）
tasks.register('copyTestmodModsToml', Copy) {
    from('src/testmod/resources/META-INF') {
        include 'neoforge.mods.toml'
    }
    into layout.buildDirectory.dir('classes/java/testmod/META-INF')
}
tasks.named('testmodClasses').configure {
    dependsOn tasks.named('copyTestmodModsToml')
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_test" {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            // 主 client 只加载主 mod（不含 testmod，避免污染正常启动）
            loadedMods = [mods."${mod_id}"]
        }
        testClient {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            disableIdeRun() // IDE 右上角用 .idea/runConfigurations/NeoForge_Test.xml（Gradle 任务），不生成重复配置
            // 测试 client 加载主 mod + testmod
            loadedMods = [mods."${mod_id}", mods."${mod_id}_test"]
            // IDE 右上角跑（无 -Psuite）默认 all = 全部套件；命令行 -Psuite=api-smoke 单套件
            systemProperty('mockplayer.test', project.findProperty('suite') ?: 'all')
            // 渲染路径验证探针（生产默认关闭，仅测试开启，记录 Mixin 注入证据）
            systemProperty('mockplayer.debugRenderProbe', 'true')
        }
        noYaclClient {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            disableIdeRun()
            loadedMods = [mods."${mod_id}", mods."${mod_id}_test"]
            // classpath 用不含 YACL 的 noyacl sourceSet（无 YACL 冒烟保持真实）
            sourceSet = sourceSets.noyacl
            // 无 YACL 冒烟：本 run 不注入 yaclDevRuntime，验证可选依赖守卫
            systemProperty('mockplayer.noyacl', '1')
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
}

dependencies {
    // YACL 配置界面（可选依赖）：编译期 compileOnly，运行期经 runtimeClasspath 注入
    compileOnly("dev.isxander:yet-another-config-lib:${yacl_version}-neoforge")
    yaclDevRuntime("dev.isxander:yet-another-config-lib:${yacl_version}-neoforge")
}

// YACL 进 main runtimeClasspath：Gradle run 与 moddev 生成的 IDE run config 都自动带，
// 配置界面在 IDE 启动时可用
configurations.named('runtimeClasspath') {
    extendsFrom(configurations.yaclDevRuntime)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
