# 版本发布：打 v* tag 自动构建 Fabric + NeoForge 并创建 GitHub Release，产物上传到 Release 喵
name: Build and Release

on:
  push:
    branches:
      - '26.1.2'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 仓库里的 gradle.properties 带本机 JDK 路径（仅本地有效），
      # CI 工作副本删掉这两行，让构建使用 setup-java 安装的 JDK
      - name: Strip machine-specific JDK settings
        run: |
          sed -i -E '/^org\.gradle\.java\.(home|installations\.paths)=/d' gradle.properties
          if grep -qE '^org\.gradle\.java\.(home|installations\.paths)=' gradle.properties; then
            echo 'machine-specific JDK settings were not stripped' >&2
            exit 1
          fi

      # 从 gradle.properties 的 java_version 动态读取 JDK 版本，
      # 将来不同 MC 版本分支换 JDK 时只需改配置，不用改 workflow
      - name: Detect Java version
        id: java
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^java_version=([0-9]+).*/\1/p' gradle.properties | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew build --stacktrace

      # 单 jar 方案：build 末尾（autoRun）自动生成 build/forgix/ 的 merged jar，
      # 这里验证它结构正确（双端元数据齐全 + 冲突类已改名隔离）
      - name: Verify merged jar structure
        shell: bash
        run: |
          set -euo pipefail
          jar=$(ls build/forgix/*.jar | head -n1)
          test -n "$jar"
          unzip -l "$jar" | grep -q 'fabric.mod.json'
          unzip -l "$jar" | grep -q 'META-INF/neoforge.mods.toml'
          unzip -l "$jar" | grep -qE '[A-Za-z0-9_]+_neoforge\.class'
          echo "merged jar OK: $jar"

      # tag 事件才创建 Release；手动触发只构建，不上传 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=()
          for f in build/forgix/*.jar; do
            files+=("$f")
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
            notes="Minecraft $mc 双端通用单 jar（Fabric + NeoForge 合并产物）"
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          fi

      - name: Upload merged jar
        uses: actions/upload-artifact@v7
        with:
          name: merged-jar
          path: build/forgix/*.jar

  # 运行验证：xvfb 虚拟显示 + Mesa 软件渲染启动 Minecraft 客户端，
  # 用 mocktest 套件验证 merged jar 在 Fabric / NeoForge 双端真实可跑（公开仓库 Actions 无限额度）
  test-merged:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Strip machine-specific JDK settings
        run: |
          sed -i -E '/^org\.gradle\.java\.(home|installations\.paths)=/d' gradle.properties
          if grep -qE '^org\.gradle\.java\.(home|installations\.paths)=' gradle.properties; then
            echo 'machine-specific JDK settings were not stripped' >&2
            exit 1
          fi

      - name: Detect Java version
        id: java
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^java_version=([0-9]+).*/\1/p' gradle.properties | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Download merged jar
        uses: actions/download-artifact@v7
        with:
          name: merged-jar
          path: build/forgix

      # 照抄 headlesshq/mc-runtime-test（26.2 fabric/neoforge ubuntu xvfb 全绿）：
      # xvfb + 真实 llvmpipe 软渲染，MC 26.2 可完整跑通主菜单/进世界/tick。
      # GLFW 3.x 的 X11 标准光标走 Xcursor 库（XcursorLibraryLoadCursor 动态加载
      # libXcursor.so.1），需要两层都满足：libxcursor1（库）+ xcursor-themes
      # （主题文件 /usr/share/icons/*/cursors/，缺任一 XcursorLibraryLoadCursor
      # 都返回 None）→ GL ERROR 65547(X11: Standard cursor shape unavailable)
      # 渲染线程卡死；曾单独装 xcursor-themes（缺库）与单独装 libxcursor1（缺主题）
      # 各失败一次，两者必须一起。其余 libXi/libXrandr/libXinerama/libXrender
      # /libXext/libXfixes 为 GLFW X11 平台依赖；xvfb-run 本体 ubuntu 镜像预装。
      - name: Install GLFW X11 dependencies and xvfb utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcursor1 xcursor-themes libxi6 libxrandr2 libxinerama1 libxrender1 libxext6 libxfixes3 \
            x11-xserver-utils

      - name: Stage merged jar into both run dirs
        run: |
          set -euo pipefail
          jar=$(ls build/forgix/*.jar | head -n1)
          mkdir -p fabric/runs/client/mods neoforge/runs/client/mods
          cp "$jar" fabric/runs/client/mods/
          cp "$jar" neoforge/runs/client/mods/
          # 无焦点窗口禁失焦暂停（防 tick 不跑）+ 禁 vsync（防 swap 阻塞）
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nframerateLimit:260\nenableVsync:false\n' > fabric/runs/client/options.txt
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nframerateLimit:260\nenableVsync:false\n' > neoforge/runs/client/options.txt
          echo "staged: $jar"

      - name: Run mocktest on Fabric (merged jar)
        timeout-minutes: 15
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: xvfb-run -a ./gradlew :fabric:runTestClient -Psuite=api-smoke -I scripts/verify-merged.gradle --console=plain

      - name: Assert Fabric api-smoke passed
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('fabric/runs/client/test-results/api-smoke.json'))
          assert d['passed'], d
          print('fabric api-smoke PASSED:', sum(1 for r in d['results'] if r.get('status') == 'PASS'))
          EOF

      - name: Run mocktest on NeoForge (merged jar)
        timeout-minutes: 15
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: xvfb-run -a ./gradlew :neoforge:runTestClient -Psuite=api-smoke -I scripts/verify-merged.gradle --console=plain

      - name: Assert NeoForge api-smoke passed
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('neoforge/runs/client/test-results/api-smoke.json'))
          assert d['passed'], d
          print('neoforge api-smoke PASSED:', sum(1 for r in d['results'] if r.get('status') == 'PASS'))
          EOF
